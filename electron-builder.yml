appId: com.klarity.app
productName: Klarity
copyright: Copyright © 2026 Klarity contributors

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - package.json
  - '!**/*.map'

# Bundled flatc binaries ship as extra resources so they stay executable and
# outside the asar (spawning a binary from inside an asar does not work).
extraResources:
  - from: resources/flatc
    to: flatc
    filter:
      - '**/*'

asar: true
asarUnpack:
  - '**/*.woff2'

npmRebuild: false

publish:
  - provider: github
    owner: devanshu0409
    repo: klarity

win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Klarity

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: build/icon.png
  category: public.app-category.developer-tools
  # Force the arch suffix on both builds, otherwise the x64 dmg ships unsuffixed
  # and reads as the canonical download for Apple Silicon users too.
  artifactName: ${productName}-${version}-${arch}.${ext}
  identity: null

linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Development
  maintainer: Klarity contributors
